<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Cards Roblox — Astral Store</title>
  <meta name="description" content="Gift Cards de Roblox. Elige tu monto y compra en segundos." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="Astral Store" data-fallback-label="Astral Store" />
        <span>Astral Store</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html">Inicio</a>
        <a href="freefire.html">Free Fire</a>
        <a href="roblox.html" class="active">Roblox</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header container">
      <div class="breadcrumb">
        <a href="index.html">Inicio</a>
        <span>/</span>
        <span>Roblox</span>
      </div>
      <h1>Gift Cards Roblox</h1>
      <p>Elige el monto de tu Gift Card.</p>
    </section>

    <section class="container">
      <div class="product-grid" id="robloxGrid" aria-live="polite">
        <!-- Los productos se generan dinámicamente desde js/products.js -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span>© <span data-year></span> Astral Store</span>
      <span>Recargas rápidas y seguras</span>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderRobloxGrid() {
      const grid = document.getElementById("robloxGrid");
      if (!grid) return;

      if (!ROBLOX_PRODUCTS.length) {
        grid.innerHTML = `<p class="empty-state">No hay Gift Cards disponibles por el momento.</p>`;
        return;
      }

      grid.innerHTML = ROBLOX_PRODUCTS.map((p) => `
        <article class="product-card">
          <div class="product-card__media">
            <img src="${p.image}" alt="${p.name}" data-fallback-label="${p.name}" />
          </div>
          <div class="product-card__body">
            <span class="product-card__name">${p.name}</span>
            <span class="product-card__bonus">${p.bonus}</span>
            <span class="product-card__price">${formatPrice(p.price)}</span>
            <button class="btn btn-primary" data-product-id="${p.id}">Comprar</button>
          </div>
        </article>
      `).join("");

      grid.querySelectorAll("[data-product-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          setSelectedProduct(btn.getAttribute("data-product-id"));
          window.location.href = "compra-roblox.html";
        });
      });
    }

    document.addEventListener("DOMContentLoaded", renderRobloxGrid);
  </script>
</body>
</html>
