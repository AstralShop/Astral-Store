<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astral Store — Recargas Free Fire y Gift Cards Roblox</title>
  <meta name="description" content="Astral Store: recargas de Diamantes de Free Fire y Gift Cards de Roblox, entrega rápida y segura." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="Astral Store" data-fallback-label="Astral Store" />
        <span>Astral Store</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="active">Inicio</a>
        <a href="freefire.html">Free Fire</a>
        <a href="roblox.html">Roblox</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero container">
      <h1>Selecciona tus Recargas</h1>
      <p>Diamantes de Free Fire y Gift Cards de Roblox, entregados de forma rápida y segura.</p>
    </section>

    <section class="container">
      <div class="game-grid">

        <article class="game-card">
          <div class="game-card__media">
            <img src="assets/freefire.jpg" alt="Free Fire" data-fallback-label="Free Fire" />
          </div>
          <div class="game-card__body">
            <h2>Free Fire</h2>
            <p>Recargas de Diamantes</p>
            <a href="freefire.html" class="btn btn-primary">Ver recargas</a>
          </div>
        </article>

        <article class="game-card">
          <div class="game-card__media">
            <img src="assets/roblox.jpg" alt="Roblox" data-fallback-label="Roblox" />
          </div>
          <div class="game-card__body">
            <h2>Roblox</h2>
            <p>Gift Cards</p>
            <a href="roblox.html" class="btn btn-primary">Ver Gift Cards</a>
          </div>
        </article>

      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span>© <span data-year></span> Astral Store</span>
      <span>Recargas rápidas y seguras</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
